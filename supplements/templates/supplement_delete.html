{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/supplement_delete.css' %}">

<div class="delete-scope">
    <div class="delete-modal">

        <div class="warning-icon">
            <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
        </div>

        <h2>Atenção, Guerreiro!</h2>
        <p>
            Você está prestes a remover este item do estoque de forma definitiva.
            <span class="item-highlight">
                <i class="fas fa-box-open item-icon" aria-hidden="true"></i>
                {{ object.name|default:"Produto Selecionado" }}
            </span>
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="button-stack">
                <button type="submit" class="confirm-btn">
                    <i class="fas fa-trash-alt" aria-hidden="true"></i> Confirmar Exclusão
                </button>
                <a href="{% url 'supplements' %}" class="cancel-btn">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar e manter produto
                </a>
            </div>
        </form>

    </div>
</div>

<script src="{% static 'js/supplement_delete.js' %}"></script>

{% endblock %}
