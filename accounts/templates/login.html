{% extends "base.html" %}

{% block content %}

<style>
    /* ===========================
   LOGIN
   Mobile First
   =========================== */

.login-container{
    width:min(100% - 2rem, 420px);
    margin:clamp(2rem, 6vw, 4rem) auto;
    padding:clamp(1.25rem, 3vw, 2rem);

    background:#fff;
    border-radius:12px;

    border-top:6px solid var(--color-primary);

    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.login-container h2{
    text-align:center;
    margin-bottom:clamp(1.25rem,2vw,1.8rem);

    color:var(--text-body);
    font-size:clamp(1.4rem,2vw,1.8rem);
}

table{
    width:100%;
    border-collapse:collapse;
}

td{
    padding:.6rem 0;
}

label{
    display:block;
    margin-bottom:.35rem;

    font-weight:600;
    color:var(--text-body);
}

input{
    width:100%;

    padding:.85rem 1rem;

    border:1px solid #d8d8d8;
    border-radius:8px;

    font-size:1rem;

    transition:
        border-color .2s,
        box-shadow .2s;
}

input:focus{
    outline:none;
    border-color:var(--color-primary);
    box-shadow:0 0 0 3px rgba(243,113,7,.15);
}

.btn-login{
    width:100%;
    margin-top:1rem;

    padding:.9rem 1rem;

    border:none;
    border-radius:8px;

    background:var(--color-primary);
    color:var(--text-inverse-strong);

    font-size:1rem;
    font-weight:700;

    transition:
        background .25s,
        transform .2s;
}

.btn-login:hover{
    background:var(--color-primary-hover);
}

.btn-login:active{
    transform:scale(.98);
}

/* ===========================
   Erros do AuthenticationForm
   =========================== */

.errorlist{
    list-style:none;
    margin-bottom:.4rem;

    color:var(--color-danger);
    font-size:.85rem;
}

/* ===========================
   Mensagens do Django
   =========================== */

.messages-container{
    display:flex;
    flex-direction:column;
    gap:.75rem;
    margin-bottom:1.25rem;
}

.messages__item{
    padding:.9rem 1rem;
    border-radius:8px;
    border-left:4px solid;
    font-size:.95rem;
}

.messages__item--success{
    background:#edfdf2;
    border-color:#22c55e;
    color:#166534;
}

.messages__item--warning{
    background:#fff8e6;
    border-color:#f59e0b;
    color:#92400e;
}

.messages__item--error{
    background:#fef2f2;
    border-color:#ef4444;
    color:#991b1b;
}
</style>

<div class="login-container">

    <h2>Entrar</h2>

    <form method="post">
        {% csrf_token %}

        <table>
            {{ login_form.as_table }}
        </table>

        <input type="submit" value="Entrar" class="btn-login">
        {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="messages__item messages__item--{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
    </form>

</div>

{% endblock %}
